name: Update AltSource

on:
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:

env:
  BRANCH: automation/update-altsource

jobs:
  update-altsource:
    name: Run script and open PR
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run update-altsource.sh
        shell: bash
        run: ./update-altsource.sh 2>&1 | tee "$RUNNER_TEMP/script-output.log"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes where made by the script, quitting early..."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git checkout -B "$BRANCH"
          git commit -am "Update AltSource"

          OPEN_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')

          if [ -n "$OPEN_PR" ] && git rev-parse --verify -q "origin/$BRANCH" >/dev/null \
             && git diff --quiet "origin/$BRANCH" HEAD; then
            echo "Open PR #$OPEN_PR already contains these changes."
            exit 0
          fi

          git push --force origin "$BRANCH"

          PR_BODY="$(cat <<EOF
          Automated update generated by \`update-altsource.sh\`.
          
          **Workflow run:** [$GITHUB_RUN_ID]($RUN_URL)
          
          <details>
          <summary>Script output</summary>
          
          \`\`\`\`
          $(tail -c 50000 "$RUNNER_TEMP/script-output.log")
          \`\`\`\`
          
          </details>
          EOF
          )"

          if [ -z "$OPEN_PR" ]; then
            gh pr create \
              --base "$BASE" \
              --head "$BRANCH" \
              --title "Update AltSource" \
              --body "$PR_BODY"
          else
            gh pr edit "$OPEN_PR" --body "$PR_BODY"
          fi